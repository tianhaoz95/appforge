name: macOS Build

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Build macOS app
        run: |
          cd app
          flutter build macos --release

      - name: Zip macOS app
        run: |
          cd app/build/macos/Build/Products/Release/
          zip -r appforge.app.zip appforge.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: app/build/macos/Build/Products/Release/appforge.app.zip
          retention-days: 3
